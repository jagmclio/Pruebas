services:
  - type: web
    name: porte-negro
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: PUBLIC_BASE_URL
        value: https://porte-negro.onrender.com
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_KV_NAMESPACE_ID
        sync: false
      - key: CF_API_TOKEN
        sync: false
